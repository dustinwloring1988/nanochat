# NanoChat Pretraining Curriculum
#
# This file defines the staged curriculum for pretraining with multi-source data mixing.
# All stages currently use a fixed 2K context; dynamic context scheduling is disabled
# until the dataloader, effective batch, compiled shapes, and resume state are validated.
#
# The source distributions change at stage boundaries. The ratios describe the
# intended document-sampling mixture, not a measured token share.

stages:
  - name: "foundation"
    token_ratio: 0.55  # 55% of total training tokens
    context_range: [2048, 2048]  # Fixed 2K until dynamic context scheduling is validated
    description: "Establish broad language understanding and general capabilities"
    
    # Source-level mixing weights
    source_weights:
      climbmix: 0.65        # Strong foundation in general web text
      nemotron_v1: 0.19     # Introduce STEM/reasoning
      nemotron_v1_1: 0.08   # Some code/logic exposure
      code_reasoning: 0.04  # Early code reasoning exposure
      nemotron_v1_2: 0.04   # Fact-based QA exposure
    
    # Per-source subset weights (for multi-subset sources)
    subset_weights:
      nemotron_v1:
        Nemotron-Pretraining-RQA: 0.35              # Reasoning QA
        Nemotron-Pretraining-STEM-SFT: 0.20         # STEM instruction following
        Nemotron-Pretraining-Math-Textbooks: 0.15   # Math content
        Nemotron-Pretraining-InfiniByte-Reasoning: 0.12       # Cross-domain problems
        Nemotron-Pretraining-Wiki-Rewrite: 0.08     # Clear explanations
        Nemotron-Pretraining-Scientific-Coding: 0.10  # Scientific code
      
      nemotron_v1_1:
        Nemotron-Pretraining-Code-Concepts: 0.45     # Programming concepts
        Nemotron-Pretraining-Multiple-Choice: 0.25   # MC questions
        Nemotron-Pretraining-Formal-Logic: 0.15      # Logic and proofs
        Nemotron-Pretraining-Unconditional-Algorithmic: 0.08  # Algorithms
        Nemotron-Pretraining-Economics: 0.07         # Economics
      
      nemotron_v1_2:
        Nemotron-Pretraining-Fact-Seeking: 0.55      # Fact-based QA
        Nemotron-Pretraining-Multiple-Choice: 0.25   # MC questions
        Nemotron-Pretraining-Generative: 0.18        # Generative QA
        Nemotron-Pretraining-Moral-Scenarios: 0.02   # Moral reasoning
  
  - name: "reasoning_and_code"
    token_ratio: 0.28  # 28% of total training tokens
    context_range: [2048, 2048]  # Fixed 2K
    description: "Focus on reasoning, mathematics, code, and algorithmic thinking"
    
    source_weights:
      climbmix: 0.42        # Reduce general text
      nemotron_v1: 0.30     # Increase STEM/reasoning
      nemotron_v1_1: 0.11   # Increase code/algorithms
      code_reasoning: 0.06  # More code reasoning in this stage
      nemotron_v1_2: 0.11   # Increase fact-seeking
    
    subset_weights:
      nemotron_v1:
        Nemotron-Pretraining-RQA: 0.40              # More reasoning
        Nemotron-Pretraining-InfiniByte-Reasoning: 0.18       # More cross-domain
        Nemotron-Pretraining-Scientific-Coding: 0.15  # More code
        Nemotron-Pretraining-Math-Textbooks: 0.15   # More math
        Nemotron-Pretraining-STEM-SFT: 0.10         # Some instruction following
        Nemotron-Pretraining-Wiki-Rewrite: 0.02     # Less wiki
      
      nemotron_v1_1:
        Nemotron-Pretraining-Code-Concepts: 0.50     # More programming
        Nemotron-Pretraining-Formal-Logic: 0.20      # More logic
        Nemotron-Pretraining-Unconditional-Algorithmic: 0.15  # More algorithms
        Nemotron-Pretraining-Multiple-Choice: 0.10   # Less MC
        Nemotron-Pretraining-Economics: 0.05         # Less economics
      
      nemotron_v1_2:
        Nemotron-Pretraining-Fact-Seeking: 0.50      # Maintain fact-seeking
        Nemotron-Pretraining-Generative: 0.25        # More generative
        Nemotron-Pretraining-Multiple-Choice: 0.23   # Maintain MC
        Nemotron-Pretraining-Moral-Scenarios: 0.02   # Keep moral reasoning
  
  - name: "long_context"
    token_ratio: 0.12  # 12% of total training tokens
    context_range: [2048, 2048]  # Fixed 2K
    description: "Extended context for complex reasoning and long-form content"
    
    source_weights:
      climbmix: 0.33        # Further reduce general text
      nemotron_v1: 0.36     # Peak specialized content
      nemotron_v1_1: 0.11   # Maintain code/logic
      code_reasoning: 0.09  # Peak code reasoning for long context
      nemotron_v1_2: 0.11   # Maintain fact-seeking
    
    subset_weights:
      nemotron_v1:
        Nemotron-Pretraining-RQA: 0.45              # Peak reasoning
        Nemotron-Pretraining-InfiniByte-Reasoning: 0.20       # Peak cross-domain
        Nemotron-Pretraining-Scientific-Coding: 0.15  # Peak code
        Nemotron-Pretraining-Math-Textbooks: 0.10   # Math content
        Nemotron-Pretraining-STEM-SFT: 0.08         # Instruction following
        Nemotron-Pretraining-Wiki-Rewrite: 0.02     # Minimal wiki
      
      nemotron_v1_1:
        Nemotron-Pretraining-Code-Concepts: 0.45     # Maintain programming
        Nemotron-Pretraining-Formal-Logic: 0.25      # Peak logic
        Nemotron-Pretraining-Unconditional-Algorithmic: 0.20  # Peak algorithms
        Nemotron-Pretraining-Multiple-Choice: 0.08   # Reduce MC
        Nemotron-Pretraining-Economics: 0.02         # Minimal economics
      
      nemotron_v1_2:
        Nemotron-Pretraining-Fact-Seeking: 0.45      # Reduce fact-seeking
        Nemotron-Pretraining-Generative: 0.30        # Peak generative
        Nemotron-Pretraining-Multiple-Choice: 0.23   # Maintain MC
        Nemotron-Pretraining-Moral-Scenarios: 0.02   # Keep moral reasoning
  
  - name: "consolidation"
    token_ratio: 0.05  # 5% of total training tokens
    context_range: [2048, 2048]  # Fixed 2K
    description: "Integrate specialized knowledge back into general distribution"
    
    source_weights:
      climbmix: 0.53        # Return to broader distribution
      nemotron_v1: 0.19     # Reduce specialized
      nemotron_v1_1: 0.11   # Maintain code
      code_reasoning: 0.06  # Maintain code reasoning
      nemotron_v1_2: 0.11   # Maintain facts
    
    subset_weights:
      nemotron_v1:
        Nemotron-Pretraining-RQA: 0.35              # Balanced reasoning
        Nemotron-Pretraining-STEM-SFT: 0.20         # More instruction following
        Nemotron-Pretraining-Math-Textbooks: 0.15   # Math content
        Nemotron-Pretraining-InfiniByte-Reasoning: 0.12       # Cross-domain
        Nemotron-Pretraining-Wiki-Rewrite: 0.10     # More wiki (consolidation)
        Nemotron-Pretraining-Scientific-Coding: 0.08  # Code
      
      nemotron_v1_1:
        Nemotron-Pretraining-Code-Concepts: 0.40     # Balanced programming
        Nemotron-Pretraining-Multiple-Choice: 0.25   # Back to MC
        Nemotron-Pretraining-Formal-Logic: 0.15      # Balanced logic
        Nemotron-Pretraining-Unconditional-Algorithmic: 0.12  # Algorithms
        Nemotron-Pretraining-Economics: 0.08         # Back to economics
      
      nemotron_v1_2:
        Nemotron-Pretraining-Fact-Seeking: 0.50      # Balanced fact-seeking
        Nemotron-Pretraining-Multiple-Choice: 0.25   # Balanced MC
        Nemotron-Pretraining-Generative: 0.20        # Balanced generative
        Nemotron-Pretraining-Moral-Scenarios: 0.05   # More moral reasoning

# Notes:
# - Total token_ratio sums to 1.00 (55% + 28% + 12% + 5%)
# - Context remains fixed at 2K across all stages
# - Source weights sum to 1.0 within each stage
# - Subset weights sum to 1.0 for each source
# - Stage transitions change source weights abruptly at stage boundaries
# - The curriculum follows: broad → specialized → very specialized → broad again
